# Supabase Configuration for BiteWise
# For detailed configuration reference documentation, visit:
# https://supabase.com/docs/guides/local-development/cli/config

# A string used to distinguish different Supabase projects on the same host
project_id = "bitewise"

[api]
enabled = true
# Port to use for the API URL
port = 54321
# Schemas to expose in your API
schemas = ["public", "graphql_public"]
# Extra schemas to add to the search_path of every request
extra_search_path = ["public", "extensions"]
# The maximum number of rows returns from a view, table, or stored procedure
max_rows = 1000

[db]
# Port to use for the local database URL
port = 54322
# Port used by db diff command to initialize the shadow database
shadow_port = 54320
# The database major version to use
major_version = 15

[studio]
enabled = true
# Port to use for Supabase Studio
port = 54323
# External URL of the API server that frontend connects to
api_url = "http://127.0.0.1"

# Email testing server - emails sent locally are captured here for viewing
[inbucket]
enabled = true
# Port to use for the email testing server web interface
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
# The maximum file size allowed
file_size_limit = "50MiB"

[realtime]
enabled = true

# =============================================================================
# AUTH CONFIGURATION
# =============================================================================

[auth]
enabled = true
# The base URL of your website - used for deep links (iOS app scheme)
site_url = "bitewise://"
# A list of exact URLs that auth providers are permitted to redirect to post authentication
additional_redirect_urls = ["bitewise://auth"]
# How long tokens are valid for, in seconds (1 hour)
jwt_expiry = 3600
# Allow/disallow new user signups to your project
enable_signup = true
# Allow/disallow anonymous sign-ins to your project
enable_anonymous_sign_ins = false
# Passwords shorter than this value will be rejected as weak
minimum_password_length = 8

# =============================================================================
# RATE LIMITS (Development - Relaxed for Testing)
# =============================================================================
# These settings are relaxed for local development and testing.
# Production rate limits should be configured via Supabase Dashboard.

[auth.rate_limit]
# Number of emails that can be sent per hour (default: 2)
# Includes verification, password reset, and magic link emails
email_sent = 100

# Number of SMS messages that can be sent per hour (default: 30)
sms_sent = 100

# Number of anonymous sign-ins per hour per IP address (default: 30)
anonymous_users = 300

# Number of sessions that can be refreshed in a 5 minute interval per IP (default: 150)
token_refresh = 500

# Number of sign up and sign-in requests in a 5 minute interval per IP (default: 30)
# THIS IS THE KEY SETTING - increase for development/testing
sign_in_sign_ups = 300

# Number of OTP / Magic link verifications in a 5 minute interval per IP (default: 30)
token_verifications = 300

# =============================================================================
# EMAIL CONFIGURATION
# =============================================================================

[auth.email]
# Allow/disallow new user signups via email to your project
enable_signup = true
# If enabled, a user will be required to confirm any email change on both addresses
double_confirm_changes = true
# If enabled, users need to confirm their email address before signing in
enable_confirmations = false
# Number of characters used in the email OTP
otp_length = 6
# Number of seconds before the email OTP expires (1 hour)
otp_expiry = 3600

[auth.sms]
# Allow/disallow new user signups via SMS
enable_signup = false
# If enabled, users need to confirm their phone number before signing in
enable_confirmations = false

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083

[analytics]
enabled = true
port = 54327
backend = "postgres"
